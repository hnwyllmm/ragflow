name: SeekDB upstream API subset (experimental)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'strict = verified 8; broad = all Go API + SDK attempt; legacy = forced reparse'
        type: choice
        options: [strict, broad, legacy]
        default: strict
      pr:
        description: 'Trusted upstream RAGFlow PR number; blank tests pinned baseline'
        type: string
        default: ''
permissions: {}
concurrency:
  group: seekdb-api-manual
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'broad' && 120 || 90 }}
    env:
      BASELINE: dc8768a32b7dc537e65a9cc4c9bb4dd65ed66ddc
    steps:
      - name: Anonymous checkout of trusted harness and candidate
        env:
          PR: ${{ inputs.pr }}
          HARNESS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -z "$PR" || "$PR" =~ ^[1-9][0-9]*$ ]]
          clone_ref() {
            git init "$1"
            git -C "$1" remote add origin "$2"
            git -C "$1" fetch --depth=1 origin "$3"
            git -C "$1" checkout --detach FETCH_HEAD
          }
          clone_ref harness https://github.com/hnwyllmm/ragflow.git "$HARNESS_SHA"
          clone_ref baseline https://github.com/infiniflow/ragflow.git "$BASELINE"
          ref="$BASELINE"; if [[ -n "$PR" ]]; then ref="refs/pull/$PR/head"; fi
          if [[ -z "$PR" ]]; then
            cp -a baseline candidate
          else
            clone_ref candidate https://github.com/infiniflow/ragflow.git "$ref"
          fi
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.27.4'
          cache: false
      - name: Prepare exact tests and native server build
        run: |
          set -euo pipefail
          mkdir -p artifacts api-client
          git -C candidate rev-parse HEAD | tee artifacts/server-sha.txt
          echo "$BASELINE" | tee artifacts/test-and-config-sha.txt
          df -h | tee artifacts/disk-before.txt
          free -h | tee artifacts/memory-before.txt
          cp baseline/test/api/*.go api-client/
          mkdir -p benchmark/test_docs
          cp baseline/test/benchmark/test_docs/Doc1.pdf benchmark/test_docs/
          printf 'module api-client\n\ngo 1.27.0\n' > api-client/go.mod
          bash harness/ci/prepare-api-stack.sh baseline candidate runtime
          # No native cache or credentials: official upstream downloader fallback.
          docker build --build-arg NEED_MIRROR=0 --build-arg NATIVE_LIBS_REQUIRED=0 \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            -f candidate/Dockerfile.api-ci -t seekdb-api-candidate:local candidate \
            2>&1 | tee artifacts/build.log
      - name: Start real SeekDB and full Go server
        id: stack
        run: |
          set -euo pipefail
          docker compose --env-file runtime/.env --project-directory runtime -f runtime/docker-compose.yml -f runtime/api.override.yml -p seekdb-api up -d
          # Authentication bootstrap retries server readiness for five minutes.
      - name: Run exact upstream tests and assert no missing or skipped cases
        if: inputs.mode == 'strict'
        env:
          HOST_ADDRESS: http://127.0.0.1:9380
          RAGFLOW_TEST_EMAIL: seekdb-ci@example.invalid
        run: |
          set -euo pipefail
          selection="^($(paste -sd'|' harness/ci/api-cases.txt))$"
          set +e
          (cd api-client && go test -tags integration -count=1 -timeout 25m -json -run "$selection" .) > artifacts/api.json 2>&1
          rc=$?
          set -e
          cat artifacts/api.json
          go run harness/ci/verify-api.go harness/ci/api-cases.txt artifacts/api.json
          exit "$rc"
      - name: Run all unchanged upstream Go API tests
        id: broad_go
        if: inputs.mode == 'broad'
        continue-on-error: true
        env:
          HOST_ADDRESS: http://127.0.0.1:9380
          RAGFLOW_TEST_EMAIL: seekdb-ci@example.invalid
        run: |
          set -euo pipefail
          set +e
          (cd api-client && timeout 2800 go test -tags integration -count=1 -timeout 45m -json .) > artifacts/api-all.json 2>&1
          rc=$?
          echo "$rc" > artifacts/api-all.exit
          go run harness/ci/report-api.go artifacts/api-all.json > artifacts/api-all-summary.md
          report_rc=$?
          set -e
          cat artifacts/api-all-summary.md
          cat artifacts/api-all-summary.md >> "$GITHUB_STEP_SUMMARY"
          (( rc == 0 && report_rc == 0 ))
      - name: Attempt unchanged upstream SDK p2 independently
        id: broad_sdk
        if: ${{ !cancelled() && inputs.mode == 'broad' && steps.broad_go.outcome != 'skipped' }}
        continue-on-error: true
        run: bash harness/ci/try-upstream-sdk.sh
      - name: Verify real seekdb lexical and hybrid retrieval
        id: hybrid
        if: ${{ !cancelled() && inputs.mode == 'broad' && steps.stack.outcome == 'success' }}
        continue-on-error: true
        env:
          CGO_ENABLED: '0'
          RAGFLOW_TEST_OCEANBASE_HOST: 127.0.0.1
          RAGFLOW_TEST_OCEANBASE_PORT: '2881'
          RAGFLOW_TEST_OCEANBASE_ENGINE_TYPE: seekdb
          RAGFLOW_TEST_OCEANBASE_DBNAME: ragflow_doc
          RAGFLOW_TEST_OCEANBASE_USER: root
          RAGFLOW_TEST_OCEANBASE_PASSWORD: infini_rag_flow
        run: |
          set -euo pipefail
          rm -f candidate/internal/engine/oceanbase/integration_test.go candidate/internal/engine/oceanbase/seekdb_ci_text_hybrid_test.go
          cp baseline/internal/engine/oceanbase/integration_test.go candidate/internal/engine/oceanbase/integration_test.go
          cp harness/ci/seekdb_text_hybrid_test.go candidate/internal/engine/oceanbase/seekdb_ci_text_hybrid_test.go
          (cd candidate && go test -tags=integration -count=1 -timeout=5m -json -run '^TestSeekDBLexicalHybridContributions$' ./internal/engine/oceanbase/) | tee artifacts/seekdb-hybrid.json
          printf '%s\n' TestSeekDBLexicalHybridContributions > artifacts/hybrid-cases.txt
          go run harness/ci/verify-api.go artifacts/hybrid-cases.txt artifacts/seekdb-hybrid.json
      - name: Report broad suite outcomes without concealing failures
        if: ${{ !cancelled() && inputs.mode == 'broad' && steps.broad_go.outcome != 'skipped' }}
        env:
          GO_OUTCOME: ${{ steps.broad_go.outcome }}
          SDK_OUTCOME: ${{ steps.broad_sdk.outcome }}
          HYBRID_OUTCOME: ${{ steps.hybrid.outcome }}
        run: |
          echo "Go suite: $GO_OUTCOME; SDK suite: $SDK_OUTCOME; seekdb hybrid: $HYBRID_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          cat artifacts/sdk-status.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          [[ "$GO_OUTCOME" == success && "$SDK_OUTCOME" == success && "$HYBRID_OUTCOME" == success ]]
      - name: Check full Worker forced reparse over the legacy SeekDB schema
        if: inputs.mode == 'legacy'
        env:
          HOST_ADDRESS: http://127.0.0.1:9380
          RAGFLOW_TEST_EMAIL: legacy-${{ github.run_id }}-${{ github.run_attempt }}@example.invalid
          SEEKDB_LEGACY_DISPOSABLE: '1'
          SEEKDB_LEGACY_PROJECT: seekdb-api
        run: |
          set -euo pipefail
          export SEEKDB_LEGACY_RUNTIME="$PWD/runtime"
          export SEEKDB_LEGACY_FIXTURE="$PWD/harness/legacy-regression/legacy-fixture.sh"
          cp harness/legacy-regression/legacy_worker_test.go api-client/
          printf '%s\n' TestSeekDBLegacyTableForcedReparseWorker22082 > artifacts/legacy-case.txt
          set +e
          (cd api-client && go test -tags integration -count=1 -timeout 15m -json -run '^TestSeekDBLegacyTableForcedReparseWorker22082$' .) > artifacts/legacy-worker.json 2>&1
          rc=$?
          set -e
          cat artifacts/legacy-worker.json
          go run harness/ci/verify-api.go artifacts/legacy-case.txt artifacts/legacy-worker.json
          exit "$rc"
      - name: Collect evidence and teardown
        if: always()
        run: |
          mkdir -p artifacts
          if test -f runtime/api.override.yml; then
            docker compose --env-file runtime/.env --project-directory runtime -f runtime/docker-compose.yml -f runtime/api.override.yml -p seekdb-api ps -a > artifacts/services.txt 2>&1 || true
            docker compose --env-file runtime/.env --project-directory runtime -f runtime/docker-compose.yml -f runtime/api.override.yml -p seekdb-api logs --no-color > artifacts/services.log 2>&1 || true
            docker compose --env-file runtime/.env --project-directory runtime -f runtime/docker-compose.yml -f runtime/api.override.yml -p seekdb-api down -v || true
          fi
          df -h > artifacts/disk-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: seekdb-api-evidence
          path: artifacts/
          retention-days: 7
